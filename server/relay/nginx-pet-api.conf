# pet-api.zyyun618.com -> the lolPing room relay on 127.0.0.1:8787.
#
# The record is DNS-only (grey cloud) and points at this server's IP, so TLS terminates here instead of at a
# Cloudflare edge. That is the point: the Cloudflare leg measured ~200 ms RTT, which put ~600 ms in front of a
# game relay that sends 5 packets a second.
#
# Installed at /etc/nginx/sites-enabled/pet-api.zyyun618.com. The filename sorts after api.zyyun618.com so that
# api stays nginx's default server for :443 when a client sends no SNI.
#
# The certificate was issued with `certbot certonly --dns-cloudflare` (the zone's API credentials already live on
# this host at /root/.secrets/cf.ini) and is renewed by certbot.timer. Never point these two lines at another
# host's certificate.
# Admin traffic is a handful of requests every few seconds; a scanner is thousands.
limit_req_zone $binary_remote_addr zone=lolping_admin:1m rate=10r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pet-api.zyyun618.com;

    ssl_certificate     /etc/letsencrypt/live/pet-api.zyyun618.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pet-api.zyyun618.com/privkey.pem;

    # The ops panel, behind a password. The trailing slash on proxy_pass strips /admin/ so the app's relative
    # "api/..." paths land on the relay's admin server unchanged.
    location = /admin { return 301 /admin/; }
    location /admin/ {
        auth_basic           "lolPing relay";
        auth_basic_user_file /etc/nginx/.htpasswd-lolping;
        limit_req            zone=lolping_admin burst=20 nodelay;
        limit_req_status     429;

        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
    }

    # Strip the namespace, but expose only these three public endpoints, never /policy/api/ or admin assets.
    location /policy/ {
        if ($uri !~ "^/policy/(claim|policy(?:/[A-Za-z0-9_-]{1,128})?)$") { return 404; }
        limit_req zone=lolping_admin burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
    }

    # The relay answers WebSocket upgrades itself; nothing else is served here.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A room can sit quiet between pings; do not cut it at the default 60 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
