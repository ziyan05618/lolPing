<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lolPing 中继后台</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b0e11; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }

  /* The switcher has to read on a near-black page, a paper page and a void page alike, so it stays neutral. */
  .switch {
    position: fixed; right: 16px; bottom: 16px; z-index: 10;
    display: flex; align-items: center; gap: 2px;
    padding: 4px; border-radius: 999px;
    background: rgba(28, 30, 33, .78);
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 6px 24px rgba(0, 0, 0, .28);
    backdrop-filter: blur(14px) saturate(140%);
    font: 11px/1 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  .switch button {
    appearance: none; border: 0; background: none; cursor: pointer;
    color: rgba(255, 255, 255, .55); padding: 7px 11px; border-radius: 999px;
    font: inherit; letter-spacing: .06em; transition: color .15s, background .15s;
  }
  .switch button:hover { color: #fff; }
  .switch button[aria-pressed="true"] { background: rgba(255, 255, 255, .92); color: #16181b; font-weight: 600; }
  .switch .sep { width: 1px; height: 14px; background: rgba(255, 255, 255, .14); margin: 0 3px; }
  .switch .name { color: rgba(255, 255, 255, .4); padding: 0 8px 0 4px; font-size: 10.5px; letter-spacing: .08em; }

  @media (max-width: 560px) { .switch .name { display: none; } }
</style>
</head>
<body>
<iframe id="frame" title="lolPing 中继后台"></iframe>

<nav class="switch" aria-label="界面主题">
  <button data-theme="control" aria-pressed="true">A</button>
  <button data-theme="ledger" aria-pressed="false">B</button>
  <button data-theme="topology" aria-pressed="false">C</button>
  <i class="sep"></i>
  <span class="name" id="name">控制室</span>
</nav>

<script>
const NAMES = { control: '控制室', ledger: '账本', topology: '拓扑' };
const KEY = 'lolping.admin.theme';
const TOKEN = new URLSearchParams(location.search).get('token') || '';

function show(theme) {
  const name = NAMES[theme] ? theme : 'control';
  document.getElementById('frame').src = 'theme-' + name + '.html' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
  document.getElementById('name').textContent = NAMES[name];
  document.querySelectorAll('.switch button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.theme === name));
  });
  try { localStorage.setItem(KEY, name); } catch { /* private mode: the choice just does not stick */ }
}

document.querySelectorAll('.switch button').forEach((b) => {
  b.onclick = () => show(b.dataset.theme);
});

let saved = 'control';
try { saved = localStorage.getItem(KEY) || 'control'; } catch { /* ignore */ }
show(saved);
</script>
</body>
</html>
